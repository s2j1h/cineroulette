services:
  cine-roulette:
    build: .
    container_name: cine-roulette
    ports:
      - "5000:5000"
    environment:
      - UPCITEMDB_API_KEY=${UPCITEMDB_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - OMDB_API_KEY=${OMDB_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
    volumes:
      - ./instance:/app/instance
      - ./cineroulette/static/covers:/app/cineroulette/static/covers
      - ./logs:/app/logs
    restart: unless-stopped
